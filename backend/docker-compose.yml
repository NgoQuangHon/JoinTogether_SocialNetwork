version: '3.9'

services:
    postgres:
        image: postgres:16
        container_name: community_postgres
        restart: always

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 123456
            POSTGRES_DB: community_db

        ports:
            - '5432:5432'

        volumes:
            - postgres_data:/var/lib/postgresql/data

            # Import file SQL
            - ./src/config/file.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
    postgres_data:
