services:
  postgres:
    image: postgres:16
    container_name: community_postgres
    restart: always
    command: >
      sh -c "ln -sf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /usr/share/zoneinfo/Asia/Saigon && docker-entrypoint.sh postgres"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Import file SQL
      - ./src/config/file.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: community_backend
    restart: always
    command: npm run dev
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
      - PGTZ=${PGTZ}
    depends_on:
      - postgres

volumes:
  postgres_data:
